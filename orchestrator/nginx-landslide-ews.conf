# /etc/nginx/sites-available/landslide-ews
# Enable: ln -s /etc/nginx/sites-available/landslide-ews /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # or your server IP

    # Optional: Basic auth (protect the endpoint)
    # auth_basic "Landslide EWS";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Optional: Rate limiting
    # limit_req_zone $binary_remote_addr zone=ews:10m rate=10r/s;
    # limit_req zone=ews burst=20 nodelay;

    location /predict {
        proxy_pass http://127.0.0.1:8080/predict;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for LLM calls (can take 30-60s)
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Optional: Block direct access to internal agent ports
    # location /api/gis/ { deny all; }
    # location /score { deny all; }
}